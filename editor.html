<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131d">
<title>ルーレットバトル エディタ</title>
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
<!-- BUILD:HEAD-START -->
<header class="app-head" id="appHead">
  <div class="brand">🎡 <span class="title">ルーレットバトル</span></div>
  <nav class="mode-switch" aria-label="画面の切り替え">
    <a href="index.html" data-mode="play" id="modePlay">🎮 あそぶ</a>
    <a href="editor.html" data-mode="edit" id="modeEdit" class="on">🛠 つくる</a>
  </nav>
  <span class="sync" id="syncInd"></span>
</header>
<!-- BUILD:HEAD-END -->

<!-- BUILD:APP-START -->
<div id="editApp">
  <div class="ed-bar">
    <span class="saved-ind" id="edSavedInd"></span>
    <div class="grow"></div>
    <button type="button" id="edWarnBtn" hidden></button>
    <button type="button" id="edExportBtn" title="データを書き出す">💾<span class="lbl"> 書き出し</span></button>
    <button type="button" id="edImportBtn" title="データを読み込む">📂<span class="lbl"> 読み込み</span></button>
    <input id="edImportFile" type="file" accept=".json,application/json" hidden>
  </div>
  <nav class="tabs" id="edTabs"></nav>
  <main class="ed-body" id="edBody">
    <aside class="panel ed-list" id="edList"></aside>
    <section class="panel ed-form" id="edForm"></section>
  </main>
  <div id="edModal" class="modal-bg" hidden></div>
</div>
<!-- BUILD:APP-END -->

<!-- BUILD:SCRIPTS-START -->
<script src="js/default-data.js?v=12"></script>
<script src="js/engine.js?v=12"></script>
<script src="js/store.js?v=12"></script>
<script src="js/ui.js?v=12"></script>
<script src="js/wheel.js?v=12"></script>
<script src="js/editor.js?v=12"></script>
<script src="js/app.js?v=12"></script>
<!-- BUILD:SCRIPTS-END -->
</body>
</html>
